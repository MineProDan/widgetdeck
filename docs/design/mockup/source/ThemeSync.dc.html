<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aesthetic: Theme Sync</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F3EA;color:#22232E;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif}
.cap{font-family:"Archivo",sans-serif;font-stretch:75%;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;line-height:1.25}
.nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #22232E;outline-offset:3px}
a{color:#B2492F}a:hover{color:#8E3522}
input[type=range]{accent-color:#22232E}
::selection{background:#F2CC8F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F3EA">
  <div style="position: absolute; top: 60px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 6px">
    <h1 class="nm" style="margin: 0; font-size: 36px">Match my wallpaper</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.35; color: #4A4C59">Theme Sync reads the photo you pick</p>
  </div>

  <div style="position: absolute; top: 152px; left: 24px; width: 342px; display: flex; gap: 16px">
    <div style="width: 112px; height: 206px; border-radius: 16px; overflow: hidden; flex-shrink: 0; box-shadow: 0 12px 26px -14px rgba(34,35,46,.5)">
      <svg width="112" height="206" viewBox="0 0 390 718" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Your wallpaper: a flat beach sunset">
        <rect width="390" height="718" fill="#F2CC8F"></rect>
        <rect width="390" height="260" fill="#F6DDB2"></rect>
        <circle cx="276" cy="470" r="128" fill="#E07A5F"></circle>
        <rect y="494" width="390" height="224" fill="#3D405B"></rect>
        <rect y="528" width="390" height="14" fill="#5B6C8F"></rect>
        <path d="M0 660 Q195 620 390 660 V718 H0 Z" fill="#EAD7B7"></path>
      </svg>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between">
      <sc-for list="{{swatches}}" as="s" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 10px; height: 36px">
          <span style="width: 40px; height: 36px; border-radius: 8px; background: {{s.c}}; box-shadow: inset 0 0 0 1px rgba(34,35,46,.08); flex-shrink: 0"></span>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span class="cap" style="font-size: 10px; color: #5B5D6B">{{s.role}}</span>
            <span class="nm" style="font-size: 15px">{{s.name}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; top: 378px; left: 24px; right: 24px; display: flex; justify-content: space-between">
    <span class="cap" style="color: #5B5D6B">Before · after</span>
    <span class="cap num" style="color: #5B5D6B">{{pct}}% before</span>
  </div>
  <div style="position: absolute; top: 402px; left: 24px; width: 342px; height: 184px; border-radius: 16px; overflow: hidden; background: #EFEAE0">
    <div style="position: absolute; left: 0; top: 0; width: 342px; height: 184px; display: flex; gap: 14px; padding: 12px; box-sizing: border-box">
      <div style="width: 157px; height: 160px; border-radius: 18px; overflow: hidden; background: #FFFDF8; display: flex; flex-direction: column; box-shadow: 0 8px 18px -10px rgba(34,35,46,.4)">
        <div style="height: 92px; background: #E07A5F; position: relative"><span style="position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #F7F3EA; top: 10px; left: 10px"></span></div>
        <div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 4px"><span class="cap" style="font-size: 10px; color: #5B5D6B">Coral Hour</span><span class="nm" style="font-size: 18px">BIO 201</span></div>
      </div>
      <div style="width: 157px; height: 160px; border-radius: 18px; overflow: hidden; background: #FFFDF8; display: flex; flex-direction: column; box-shadow: 0 8px 18px -10px rgba(34,35,46,.4)">
        <div style="height: 92px; background: #3D405B; position: relative"><span style="position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #F7F3EA; top: 10px; left: 10px"></span></div>
        <div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 4px"><span class="cap" style="font-size: 10px; color: #5B5D6B">Deep Tide</span><span class="nm" style="font-size: 18px">82%</span></div>
      </div>
    </div>
    <div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{pct}}%; overflow: hidden; background: #ECECEC; border-right: 2px solid #22232E">
      <div style="width: 342px; height: 184px; display: flex; gap: 14px; padding: 12px; box-sizing: border-box">
        <div style="width: 157px; height: 160px; border-radius: 18px; overflow: hidden; background: #FFFFFF; display: flex; flex-direction: column">
          <div style="height: 92px; background: #C9CBD1"></div>
          <div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; color: #5F616B">NEXT CLASS</span><span style="font-size: 18px; font-weight: 600; color: #1C1C1E">BIO 201</span></div>
        </div>
        <div style="width: 157px; height: 160px; border-radius: 18px; overflow: hidden; background: #FFFFFF; display: flex; flex-direction: column">
          <div style="height: 92px; background: #C9CBD1"></div>
          <div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; color: #5F616B">BATTERY</span><span style="font-size: 18px; font-weight: 600; color: #1C1C1E">82%</span></div>
        </div>
      </div>
    </div>
  </div>
  <label style="position: absolute; top: 596px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 4px">
    <span class="cap" style="color: #5B5D6B">Drag to compare</span>
    <input type="range" min="0" max="100" value="{{pct}}" onChange="{{slide}}" onInput="{{slide}}" style="width: 100%; height: 32px; margin: 0">
  </label>

  <div style="position: absolute; top: 668px; left: 24px; right: 24px; display: flex; align-items: center; gap: 10px">
    <a href="HomeScreen.dc.html" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: #22232E; color: #FFFDF8; text-decoration: none; font-size: 17px; font-weight: 600">Apply to 6 widgets</a>
    <span class="cap" style="color: #4C7A62; width: 76px">Contrast checked · AA</span>
  </div>

  <nav aria-label="Sections" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; background: #F7F3EA; border-top: 1px solid #E4DED1; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 7px; box-sizing: border-box">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 66px; min-height: 44px; color: #6B6D7A; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"></path></svg><span class="cap" style="font-size: 10px">Home</span></a>
    <a href="Student.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 66px; min-height: 44px; color: #6B6D7A; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-4 9 4-9 4-9-4z"></path><path d="M7 11v5c0 1.4 2.2 3 5 3s5-1.6 5-3v-5"></path></svg><span class="cap" style="font-size: 10px">Student</span></a>
    <a href="ThemeSync.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 66px; min-height: 44px; color: #22232E; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="6" height="17" rx="1.5"></rect><path d="M10 8l5-3 4.5 7.5L10 18"></path></svg><span class="cap" style="font-size: 10px">Aesthetic</span></a>
    <a href="Wellness.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 66px; min-height: 44px; color: #6B6D7A; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-14 14-14 0 9-6 14-14 14z"></path><path d="M5 19l8-8"></path></svg><span class="cap" style="font-size: 10px">Wellness</span></a>
    <a href="Tech.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 66px; min-height: 44px; color: #6B6D7A; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16a8 8 0 1 1 16 0"></path><path d="M12 16l4-5"></path></svg><span class="cap" style="font-size: 10px">Tech</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pct: 44 }; }
  renderVals() {
    return {
      pct: this.state.pct,
      slide: (e) => this.setState({ pct: Number(e.target.value) }),
      swatches: [
        { c: '#F6DDB2', role: 'Surface', name: 'Shell' },
        { c: '#F2CC8F', role: 'Background', name: 'Dune' },
        { c: '#E07A5F', role: 'Accent', name: 'Coral Hour' },
        { c: '#5B6C8F', role: 'Primary', name: 'Evening Sea' },
        { c: '#3D405B', role: 'Text', name: 'Deep Tide' }
      ]
    };
  }
}
</script>
</body>
</html>
