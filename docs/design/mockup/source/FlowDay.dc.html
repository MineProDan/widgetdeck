<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flow widget through the day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F3EA;color:#22232E;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif}
.cap{font-family:"Archivo",sans-serif;font-stretch:75%;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;line-height:1.25}
.nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
::selection{background:#F2CC8F}
</style>
</helmet>
<div style="width: 1960px; height: 520px; position: relative; background: #F7F3EA; box-sizing: border-box; padding: 56px 48px">
  <div aria-hidden="true" style="position: absolute; left: 48px; right: 48px; top: 142px; height: 2px; background: #E4DED1"></div>
  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 40px">
    <sc-for list="{{moments}}" as="m" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span class="nm num" style="font-size: 34px">{{m.time}}</span>
          <div style="display: flex; align-items: center; gap: 8px; height: 20px">
            <span style="width: 14px; height: 14px; border-radius: 50%; background: {{m.color}}; box-shadow: 0 0 0 4px #F7F3EA"></span>
            <span class="cap" style="color: #5B5D6B">{{m.when}}</span>
          </div>
        </div>
        <div style="width: 338px; height: 158px; border-radius: 22px; overflow: hidden; background: #FFFDF8; box-shadow: 0 1px 2px rgba(34,35,46,.08), 0 16px 32px -16px rgba(34,35,46,.4); display: flex">
          <div style="width: 128px; background: {{m.color}}; position: relative; display: flex; align-items: center; justify-content: center">
            <span style="position: absolute; width: 11px; height: 11px; border-radius: 50%; background: #F7F3EA; top: 13px; left: 13px"></span>
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="{{m.glyph}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{m.icon}}"></path></svg>
          </div>
          <div style="flex-grow: 1; padding: 14px 16px; display: flex; flex-direction: column; justify-content: center; gap: 4px">
            <span class="cap" style="color: #5B5D6B">{{m.paint}}</span>
            <span class="nm num" style="font-size: 24px">{{m.line1}}</span>
            <span class="nm num" style="font-size: 24px">{{m.line2}}</span>
            <span class="cap" style="color: {{m.noteColor}}">{{m.note}}</span>
          </div>
        </div>
        <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #4A4C59; max-width: 320px">{{m.why}}</p>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1960,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      moments: [
        { time: '07:30', when: 'Morning', color: '#F2CC8F', glyph: '#22232E', icon: 'M12 3v2M5 12H3M21 12h-2M6.3 6.3L4.9 4.9M17.7 6.3l1.4-1.4M8 16a4 4 0 1 1 8 0M3 19h18', paint: 'Oat Morning · WG 0730', line1: 'You start at 9:00', line2: 'Leave by 8:40', note: 'Today: I can do hard things', noteColor: '#5B5D6B', why: 'Affirmation and your first class together, so the morning glance answers "when do I leave?".' },
        { time: '08:46', when: 'Before class', color: '#E07A5F', glyph: '#FFFDF8', icon: 'M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z', paint: 'Coral Hour · WG 0914', line1: 'BIO 201', line2: 'in 14 min', note: 'Room 3B · leave now', noteColor: '#B2492F', why: 'The countdown ticks on its own. Showing it uses none of the widget’s refresh budget.' },
        { time: '12:10', when: 'Midday', color: '#81B29A', glyph: '#FFFDF8', icon: 'M5 12.5l4.5 4.5L19 7.5', paint: 'Sage Noon · WG 1210', line1: 'Habits left', line2: '1 of 3', note: 'Tap to tick off stretch', noteColor: '#4C7A62', why: 'Tick a habit off right on the home screen. No need to open the app.' },
        { time: '15:00', when: 'Afternoon', color: '#3D405B', glyph: '#F2CC8F', icon: 'M9 3h6M12 3v3M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM12 9v4', paint: 'Study Ink · WG 1500', line1: 'Lab report', line2: 'due tomorrow', note: 'Start a 25 min focus', noteColor: '#3D405B', why: 'A deadline shows up with a focus button next to it, so starting takes one tap.' },
        { time: '21:00', when: 'Evening', color: '#6D597A', glyph: '#FFFDF8', icon: 'M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z', paint: 'Plum Dusk · WG 2100', line1: 'How was', line2: 'today?', note: 'Rough · Low · Okay · Good · Great', noteColor: '#6D597A', why: 'The day ends with a one-tap mood check-in. Your streaks and trends come from these taps.' }
      ]
    };
  }
}
</script>
</body>
</html>
