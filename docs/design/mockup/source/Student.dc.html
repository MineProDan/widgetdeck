<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Student: schedule</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F3EA;color:#22232E;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif}
.cap{font-family:"Archivo",sans-serif;font-stretch:75%;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;line-height:1.25}
.nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #22232E;outline-offset:3px}
a{color:#B2492F}a:hover{color:#8E3522}
::selection{background:#F2CC8F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F3EA">
  <div style="position: absolute; top: 60px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 6px">
    <h1 class="nm" style="margin: 0; font-size: 40px">Schedule</h1>
  </div>

  <div role="tablist" aria-label="Student views" style="position: absolute; top: 126px; left: 24px; width: 342px; height: 36px; border-radius: 10px; background: #ECE6DA; padding: 2px; box-sizing: border-box; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px">
    <button role="tab" aria-selected="true" style="border: 0; border-radius: 8px; background: #FFFDF8; font-size: 13px; font-weight: 600; box-shadow: 0 1px 3px rgba(34,35,46,.15)">Schedule</button>
    <button role="tab" aria-selected="false" style="border: 0; border-radius: 8px; background: transparent; font-size: 13px">Due</button>
    <button role="tab" aria-selected="false" style="border: 0; border-radius: 8px; background: transparent; font-size: 13px">Grades</button>
    <button role="tab" aria-selected="false" style="border: 0; border-radius: 8px; background: transparent; font-size: 13px">Focus</button>
  </div>

  <div style="position: absolute; top: 188px; left: 24px; width: 342px; display: grid; grid-template-columns: 30px repeat(5, minmax(0, 1fr)); gap: 0">
    <span></span>
    <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
      <div style="display: flex; justify-content: center"><span class="cap" style="padding: 4px 8px; border-radius: 10px; background: {{d.bg}}; color: {{d.fg}}">{{d.label}}</span></div>
    </sc-for>
  </div>

  <div style="position: absolute; top: 218px; left: 24px; width: 342px; height: 292px">
    <sc-for list="{{hours}}" as="h" hint-placeholder-count="8">
      <div style="position: absolute; left: 0; right: 0; top: {{h.y}}px; height: 1px; background: #E4DED1"></div>
      <span class="cap num" style="position: absolute; left: 0; top: {{h.ly}}px; font-size: 10px; color: #6B6D7A">{{h.label}}</span>
    </sc-for>
    <div aria-hidden="true" style="position: absolute; left: 217px; width: 62px; top: 0; bottom: 0; background: rgba(224,122,95,.08); border-radius: 8px"></div>
    <sc-for list="{{classes}}" as="c" hint-placeholder-count="10">
      <div style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: 58px; height: {{c.h}}px; border-radius: 8px; overflow: hidden; background: #FFFDF8; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(34,35,46,.1), 0 6px 12px -8px rgba(34,35,46,.35)">
        <div style="flex-grow: 1; background: {{c.color}}"></div>
        <div style="height: 20px; display: flex; align-items: center; padding: 0 5px"><span class="cap" style="font-size: 9px">{{c.code}}</span></div>
      </div>
    </sc-for>
    <div aria-label="Now, 8:46" style="position: absolute; left: 213px; width: 70px; top: 27px; height: 2px; background: #B2492F"></div>
    <span style="position: absolute; left: 209px; top: 23px; width: 10px; height: 10px; border-radius: 50%; background: #B2492F"></span>
  </div>

  <div style="position: absolute; top: 528px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span class="cap" style="color: #5B5D6B">Due soon</span>
      <a href="#" class="cap" style="text-decoration: none; padding: 10px 0 10px 12px">All 7</a>
    </div>
    <sc-for list="{{due}}" as="t" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; height: 56px; border-radius: 12px; background: #FFFDF8; padding: 0 6px 0 0; overflow: hidden; box-shadow: 0 1px 2px rgba(34,35,46,.06)">
        <span style="width: 52px; align-self: stretch; background: {{t.color}}; position: relative; flex-shrink: 0"><span style="position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #F7F3EA; top: 8px; left: 8px"></span></span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
          <span class="nm" style="font-size: 16px">{{t.title}}</span>
          <span class="cap" style="color: {{t.dueColor}}">{{t.meta}}</span>
        </div>
        <button aria-label="Mark {{t.title}} done" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #9A9CA8"></span></button>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Sections" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; background: #F7F3EA; border-top: 1px solid #E4DED1; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 7px; box-sizing: border-box">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 66px; min-height: 44px; color: #6B6D7A; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"></path></svg><span class="cap" style="font-size: 10px">Home</span></a>
    <a href="Student.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 66px; min-height: 44px; color: #22232E; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-4 9 4-9 4-9-4z"></path><path d="M7 11v5c0 1.4 2.2 3 5 3s5-1.6 5-3v-5"></path></svg><span class="cap" style="font-size: 10px">Student</span></a>
    <a href="ThemeSync.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 66px; min-height: 44px; color: #6B6D7A; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="6" height="17" rx="1.5"></rect><path d="M10 8l5-3 4.5 7.5L10 18"></path></svg><span class="cap" style="font-size: 10px">Aesthetic</span></a>
    <a href="Wellness.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 66px; min-height: 44px; color: #6B6D7A; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-14 14-14 0 9-6 14-14 14z"></path><path d="M5 19l8-8"></path></svg><span class="cap" style="font-size: 10px">Wellness</span></a>
    <a href="Tech.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 66px; min-height: 44px; color: #6B6D7A; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16a8 8 0 1 1 16 0"></path><path d="M12 16l4-5"></path></svg><span class="cap" style="font-size: 10px">Tech</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const col = (d) => 32 + d * 62.4;
    const row = (h) => (h - 8) * 36;
    const mk = (d, start, end, code, color) => ({ x: col(d), y: row(start) + 2, h: (end - start) * 36 - 4, code, color });
    const labels = ['8', '9', '10', '11', '12', '1', '2', '3'];
    return {
      days: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].map((l, i) => ({ label: l, bg: i === 3 ? '#22232E' : 'transparent', fg: i === 3 ? '#FFFDF8' : '#5B5D6B' })),
      hours: labels.map((l, i) => ({ label: l, y: i * 36, ly: i * 36 + 3 })),
      classes: [
        mk(0, 9, 10, 'BIO 201', '#E07A5F'), mk(2, 9, 10, 'BIO 201', '#E07A5F'), mk(4, 9, 10, 'BIO 201', '#E07A5F'),
        mk(1, 9, 10, 'ENG 110', '#F2CC8F'), mk(3, 9, 10, 'ENG 110', '#F2CC8F'),
        mk(1, 10.5, 12, 'CHEM 150', '#3D405B'), mk(3, 10.5, 12, 'CHEM 150', '#3D405B'),
        mk(0, 13, 14, 'PSY 101', '#81B29A'), mk(2, 13, 14, 'PSY 101', '#81B29A'),
        mk(3, 14, 15.5, 'CHEM LAB', '#3D405B')
      ],
      due: [
        { title: 'Lab report', meta: 'CHEM 150 · Tomorrow 11:59 PM', color: '#3D405B', dueColor: '#B2492F' },
        { title: 'Reading response', meta: 'ENG 110 · Fri 5:00 PM', color: '#F2CC8F', dueColor: '#5B5D6B' },
        { title: 'Problem set 4', meta: 'BIO 201 · Mon 9:00 AM', color: '#E07A5F', dueColor: '#5B5D6B' }
      ]
    };
  }
}
</script>
</body>
</html>
